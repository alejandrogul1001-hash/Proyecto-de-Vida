<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none" className="w-full h-full">
  <!-- Circular Base -->
  <circle cx="250" cy="250" r="235" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="6"/>
  
  <!-- Outer Ring with FADE & Contabilidad -->
  <circle cx="250" cy="250" r="210" stroke="#CBD5E1" stroke-width="48" fill="none"/>
  
  <!-- Text Along Arc / Path for CONTABILIDAD Y AUDITORIA -->
  <path id="contabilidadPath" d="M 90 280 A 180 180 0 1 1 380 340" fill="none" />
  <text font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#1E293B" letter-spacing="4">
    <textPath href="#contabilidadPath" startOffset="5%">
      CONTABILIDAD Y AUDITORIA
    </textPath>
  </text>
  
  <!-- FADE Text on Right -->
  <g transform="translate(420, 250)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#0F172A">
    <text x="0" y="-45">F</text>
    <text x="0" y="-10">A</text>
    <text x="0" y="25">D</text>
    <text x="0" y="60">E</text>
  </g>
  
  <!-- Central Emblem: Outer gray "C" arc -->
  <path d="M 330 160 A 120 120 0 1 0 330 340" stroke="#94A3B8" stroke-width="42" stroke-linecap="round" fill="none"/>
  
  <!-- Central Stylized Red "a" -->
  <circle cx="250" cy="265" r="54" fill="#B91C1C"/>
  <circle cx="250" cy="265" r="28" fill="#FFFFFF"/>
  <rect x="276" y="210" width="30" height="105" rx="8" fill="#B91C1C"/>
</svg>
